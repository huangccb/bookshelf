name: Docker Image & Release

# 推送 master 或打 v* 标签时构建镜像并推送到 GitHub Container Registry；
# PR 只做构建验证，不推送。也可以在 Actions 页面手动触发。
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # github.repository 已经是小写的 "owner/repo"，可直接拼成镜像名
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # buildx 生成 provenance / SBOM 证明时用
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 纯 JS 镜像，但要同时出 amd64 / arm64（群晖、树莓派、Apple Silicon 都能直接跑）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 默认分支推送 -> latest
            type=raw,value=latest,enable={{is_default_branch}}
            # 其他分支 -> 分支名
            type=ref,event=branch
            # PR -> pr-<编号>
            type=ref,event=pr
            # v1.2.0 标签 -> 1.2.0 / 1.2 / 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # 每次提交都留一个可回溯的 sha 标签
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Summary
        run: |
          {
            echo "### 镜像构建完成"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "拉取：\`docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # 打 v* 标签时：等镜像推送成功后自动创建 GitHub Release（源码包由 GitHub 自动附带）
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # 0.x 或带预发布后缀的都算预览版
          case "$VERSION" in
            0.*|*-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT"; echo "label=预览版" >> "$GITHUB_OUTPUT" ;;
            *)       echo "prerelease=false" >> "$GITHUB_OUTPUT"; echo "label=正式版" >> "$GITHUB_OUTPUT" ;;
          esac
          # 从 CHANGELOG.md 抽出当前版本的条目
          if grep -q "^## ${VERSION}" CHANGELOG.md; then
            awk -v ver="$VERSION" '/^## / { show = (index($0, "## " ver) == 1) } show' CHANGELOG.md > release-notes.md
          else
            echo "## v${VERSION}" > release-notes.md
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "### 容器镜像"
            echo ""
            echo '```bash'
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
            echo '```'
            echo ""
            echo "多架构：\`linux/amd64\`、\`linux/arm64\`。源码包见下方 Assets。"
          } >> release-notes.md
          echo "----- release notes -----"
          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.notes.outputs.version }} · ${{ steps.notes.outputs.label }}"
          body_path: release-notes.md
          prerelease: ${{ steps.notes.outputs.prerelease }}
