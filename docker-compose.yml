services:
  bookshelf:
    build: .
    # 默认用本地构建的 bookshelf:latest。想直接跑 CI 推到 GHCR 的镜像：
    #   IMAGE=ghcr.io/huangccb/bookshelf:latest docker compose pull
    #   IMAGE=ghcr.io/huangccb/bookshelf:latest docker compose up -d
    image: "${IMAGE:-bookshelf:latest}"
    container_name: bookshelf
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # 首次启动时创建的管理员账户；已存在时不会覆盖密码
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@admin.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
      # 生产环境务必换成随机长字符串
      JWT_SECRET: "${JWT_SECRET:-arknights-bookshelf-secret-key}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - bookshelf-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  bookshelf-data:
